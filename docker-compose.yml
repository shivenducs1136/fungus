services:
  api-release:
    profiles: ["release"]
    build:
      context: .
      target: release
    container_name: fungus_api_release
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      SMTP_CREDENTIALS_KEY_FILE: /run/secrets/smtp_credentials_key
    secrets:
      - smtp_credentials_key
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fungus_network
    restart: unless-stopped

  api-dev:
    profiles: ["dev"]
    build:
      context: .
      target: dev
    container_name: fungus_api_dev
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      SMTP_CREDENTIALS_KEY_FILE: /run/secrets/smtp_credentials_key
    secrets:
      - smtp_credentials_key
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fungus_network
    restart: unless-stopped

  frontend-release:
    profiles: ["release"]
    build:
      context: ./frontend
      target: release
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: fungus_frontend_release
    ports:
      - "3000:80"
    env_file:
      - .env
    depends_on:
      - api-release
    networks:
      - fungus_network
    restart: unless-stopped

  frontend-dev:
    profiles: ["dev"]
    build:
      context: ./frontend
      target: dev
    container_name: fungus_frontend_dev
    ports:
      - "5173:5173"
    env_file:
      - .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api-dev
    networks:
      - fungus_network
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: fungus_db
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fungus_network
    restart: unless-stopped

networks:
  fungus_network:
    driver: bridge

volumes:
  postgres_data:

secrets:
  smtp_credentials_key:
    file: ${SMTP_CREDENTIALS_KEY_SOURCE_FILE:-./secrets/smtp_credentials_key}
