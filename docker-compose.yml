services:
  api-release:
    profiles: ["release"]
    build:
      context: .
      target: release
    container_name: fungus_api_release
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fungus_network
    restart: unless-stopped

  api-dev:
    profiles: ["dev"]
    build:
      context: .
      target: dev
    container_name: fungus_api_dev
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fungus_network
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: fungus_db
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fungus_network
    restart: unless-stopped

networks:
  fungus_network:
    driver: bridge

volumes:
  postgres_data:
