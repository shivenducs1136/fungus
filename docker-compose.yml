version: '3.8'

services:
  api:
    build: .
    container_name: fungus_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/fungus
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fungus_network
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: fungus_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fungus
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fungus_network
    restart: unless-stopped

networks:
  fungus_network:
    driver: bridge

volumes:
  postgres_data:
